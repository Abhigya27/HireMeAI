[project]
name = "hiremeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhigya Narain", email = "narainabhigya27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "config>=0.5.1",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pypdf>=6.18.0",
    "pyproject-toml>=0.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "slowapi",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
hiremeai = "hiremeai:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
