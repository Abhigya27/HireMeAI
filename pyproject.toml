[project]
name = "hiremeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhigya Narain", email = "narainabhigya27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pypdf>=6.21.2",
    "pyproject-toml>=0.1.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
